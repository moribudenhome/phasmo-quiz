<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファスモクイズ（自分用）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root{
    --bg:#0d1017; --panel:#161c28; --panel2:#1b2333; --line:#273042;
    --text:#dbe2ee; --dim:#8b96ab; --accent:#5ee6b0; --accent-dim:#2c5c4a;
    --wrong:#ff6b6b; --warn:#e8c268;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
    font-size:15px; line-height:1.7;
    padding-block:24px; padding-inline:16px;
  }
  .wrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:16px}

  header h1{
    font-family:"DotGothic16",monospace; font-size:28px; margin:0;
    letter-spacing:.04em; color:var(--accent); text-wrap:balance;
    text-shadow:0 0 18px rgba(94,230,176,.35);
  }
  header p{margin:4px 0 0; color:var(--dim); font-size:13px}

  .tabs{display:flex; gap:8px}
  .tab{
    font-family:"DotGothic16",monospace; font-size:15px; letter-spacing:.06em;
    background:var(--panel); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:8px 20px; cursor:pointer;
  }
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--accent); color:#08120d; border-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; text-align:center;
  }
  .stat .v{font-family:"DotGothic16",monospace; font-size:22px; color:var(--accent); font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px; color:var(--dim); letter-spacing:.08em}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px;
  }
  .chiprow{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
  .chip{
    font-size:11px; letter-spacing:.1em; padding:2px 10px; border-radius:999px;
    border:1px solid var(--line); color:var(--dim); background:var(--panel2);
  }
  .chip.hunt{color:var(--wrong); border-color:#5c2c2c}
  .qno{font-size:11px; color:var(--dim); letter-spacing:.1em; margin-left:auto}
  .question{font-size:17px; font-weight:600; margin:0 0 16px; text-wrap:balance; white-space:pre-line}

  .answers{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media (max-width:520px){ .answers{grid-template-columns:1fr} }
  .ans{
    font-family:inherit; font-size:15px; text-align:left;
    background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .ans:hover:not(:disabled){border-color:var(--accent); background:#1e2a3c}
  .ans:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .ans:disabled{cursor:default; opacity:.75}
  .ans.correct{border-color:var(--accent); background:var(--accent-dim); color:#eafff6; opacity:1}
  .ans.wrong{border-color:var(--wrong); background:#4a2626; color:#ffe3e3; opacity:1}
  .ans.idk{
    grid-column:1/-1; text-align:center; color:var(--dim);
    background:transparent; border-style:dashed;
    font-family:"DotGothic16",monospace; letter-spacing:.08em;
  }
  .ans.idk:hover:not(:disabled){color:var(--warn); border-color:var(--warn); background:transparent}

  .feedback{margin-top:16px; border-top:1px dashed var(--line); padding-top:14px}
  .verdict{font-family:"DotGothic16",monospace; font-size:20px; margin:0 0 6px}
  .verdict.ok{color:var(--accent)} .verdict.ng{color:var(--wrong)}
  .expl{margin:0; color:var(--dim); font-size:14px}
  .expl b{color:var(--text)}
  .qrecord{
    margin:10px 0 0; font-size:13px; color:var(--dim);
    font-variant-numeric:tabular-nums;
  }
  .qrecord b{color:var(--accent)}

  .nextrow{display:flex; gap:10px; margin-top:16px}
  .btn{
    font-family:"DotGothic16",monospace; font-size:16px; letter-spacing:.06em;
    background:var(--accent); color:#08120d; border:none; border-radius:8px;
    padding:10px 22px; cursor:pointer;
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:focus-visible{outline:2px solid var(--text); outline-offset:2px}
  .btn.ghostbtn{background:transparent; color:var(--dim); border:1px solid var(--line); font-size:13px}
  .btn.ghostbtn:hover{color:var(--text); border-color:var(--dim)}

  /* ===== 理解度画面 ===== */
  .overview{
    display:flex; gap:16px; align-items:center; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px;
  }
  .overview .big{font-family:"DotGothic16",monospace; font-size:34px; color:var(--accent); font-variant-numeric:tabular-nums}
  .overview .sub{font-size:12px; color:var(--dim)}
  .glist{display:flex; flex-direction:column; gap:8px}
  details.gcard{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
  }
  details.gcard summary{
    list-style:none; cursor:pointer; padding:12px 16px;
    display:grid; grid-template-columns:auto auto 1fr auto; gap:12px; align-items:center;
  }
  details.gcard summary::-webkit-details-marker{display:none}
  details.gcard summary::before{
    content:"▸"; color:var(--dim); font-size:13px; width:1em;
  }
  details.gcard[open] summary::before{content:"▾"; color:var(--accent)}
  details.gcard summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:10px}
  .gname{font-family:"DotGothic16",monospace; font-size:16px; min-width:9.5em}
  .gbarwrap{display:flex; flex-direction:column; gap:4px; min-width:120px}
  .gbar{height:8px; border-radius:4px; background:var(--panel2); border:1px solid var(--line); overflow:hidden}
  .gbar i{display:block; height:100%; background:var(--accent)}
  .gsub{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}
  .gpct{
    font-family:"DotGothic16",monospace; font-size:20px; min-width:3.2em; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .lv-hi{color:var(--accent)} .lv-mid{color:var(--warn)} .lv-lo{color:var(--wrong)} .lv-none{color:var(--dim)}
  .gdetail{border-top:1px dashed var(--line); padding:10px 16px 14px; display:flex; flex-direction:column; gap:6px}
  .qrow{display:grid; grid-template-columns:1.6em 1fr auto; gap:8px; font-size:13px; align-items:baseline}
  .qrow .mark{font-family:"DotGothic16",monospace; text-align:center}
  .qrow .txt{color:var(--dim)}
  .qrow .cnt{color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
  .qrow.hunt .txt::before{content:"⚠ "; color:var(--wrong)}
  .seclabel{
    font-family:"DotGothic16",monospace; font-size:14px; color:var(--dim);
    letter-spacing:.1em; margin:8px 0 0;
  }

  footer{color:var(--dim); font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
  @media (prefers-reduced-motion:no-preference){
    .card{animation:pop .18s ease-out}
    @keyframes pop{from{transform:translateY(4px); opacity:.6} to{transform:none; opacity:1}}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ファスモクイズ（自分用）</h1>
    <p>証拠(EMF・DOTS等)以外の固有特徴だけで当てる。全30ゴースト収録・毎回ランダム出題。データは日本語非公式Wiki準拠(2026-09-27取得)。</p>
    <p>成績データはブラウザ毎に保存されますが、自分用なので改修などで成績データが予告なく飛ぶ可能性が有ります。ご了承ください。</p>
  </header>

  <nav class="tabs">
    <button class="tab active" id="tabQuiz">クイズ</button>
    <button class="tab" id="tabMastery">理解度</button>
  </nav>

  <!-- ===== クイズ画面 ===== -->
  <div id="viewQuiz" style="display:flex; flex-direction:column; gap:16px">
    <div class="stats">
      <div class="stat"><div class="v" id="stCorrect">0</div><div class="l">正解</div></div>
      <div class="stat"><div class="v" id="stTotal">0</div><div class="l">出題</div></div>
      <div class="stat"><div class="v" id="stStreak">0</div><div class="l">連続正解</div></div>
      <div class="stat"><div class="v" id="stBest">0</div><div class="l">ベスト連続</div></div>
    </div>

    <div class="card" id="card">
      <div class="chiprow">
        <span class="chip" id="chipCat">カテゴリ</span>
        <span class="chip" id="chipType">形式</span>
        <span class="qno" id="qno">Q1</span>
      </div>
      <p class="question" id="qtext">…</p>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback" hidden>
        <p class="verdict" id="verdict"></p>
        <p class="expl" id="expl"></p>
        <p class="qrecord" id="qrecord"></p>
        <div class="nextrow">
          <button class="btn" id="nextBtn">次の問題 ▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 理解度画面 ===== -->
  <div id="viewMastery" style="display:none; flex-direction:column; gap:16px">
    <div class="overview">
      <div>
        <div class="big" id="ovPct">0%</div>
        <div class="sub">総合習得度 ── 各問題を3回連続正解で「習得」</div>
      </div>
      <div style="flex:1; min-width:180px">
        <div class="gbar" style="height:10px"><i id="ovBar" style="width:0%"></i></div>
        <div class="sub" id="ovSub" style="margin-top:6px">-</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
      <p class="seclabel" style="margin:0">ゴーストごとの習得状況(クリックで問題別の内訳)</p>
      <button class="btn ghostbtn" id="expandAllBtn">すべて展開</button>
    </div>
    <div class="glist" id="glist"></div>
    <p class="seclabel">共通知識</p>
    <div class="glist" id="glistCommon"></div>
  </div>

  <footer>
    <span>正答率: <b id="stRate">-</b> ｜ 成績はこのブラウザに保存されます</span>
    <button class="btn ghostbtn" id="resetBtn">成績リセット</button>
  </footer>
</div>

<script>
"use strict";

// ===== ゴースト一覧(30体) 表記は日本語非公式Wiki準拠 =====
const GHOSTS = [
  "スピリット","レイス","ファントム","ポルターガイスト","バンシー","ジン",
  "メアー","レヴナント","シェード","デーモン","幽霊","鬼",
  "妖怪","ハントゥ","御霊","マイリング","怨霊","ツインズ",
  "雷獣","化け狐","ミミック","モーロイ","デオヘン","セーイ",
  "ダヤン","ガルル","オバンボ","コルモス","アスワング","ディルデガスト"
];
const COMMON = "共通知識";

// ===== 特徴データベース(日本語非公式Wiki準拠) =====
// g: 該当ゴースト / t: 特徴文 / cat: カテゴリ / hunt: ハント関連
// n: 解説(実戦での使い方) / ex: 誤答選択肢から除外する紛らわしいゴースト
const FACTS = [
  // スピリット
  {g:["スピリット"], cat:"アイテム対策", t:"浄化香を当てられると180秒間ハントを起こせなくなる(通常のゴーストは90秒)",
   n:"【基準】浄化香のハント抑止は通常90秒、デーモン60秒、スピリットだけ180秒。浄化香を当てて時間を計り、90秒〜3分の間にハントが来たらスピリット以外が確定。3分間沈黙ならスピリット濃厚(正気度50%以下まで下げてから計ること。高いとそもそもハントできないだけ)。"},
  // レイス
  {g:["レイス"], cat:"塩・足跡", t:"塩を一切踏まず、足跡を残さない", ex:["ガルル"],
   n:"【基準】他の全ゴーストは塩の山を踏んで乱し、直後にUVライトで光る足跡を残す。レイスだけは一切踏まない。入口に塩+モーションセンサーを置き、センサーが反応したのに塩が無事ならレイス確定級(ガルルも激昂状態のみ踏まなくなるので注意)。"},
  {g:["レイス"], cat:"能力", t:"ランダムなプレイヤーの足元にテレポートし、EMF2またはEMF5を残す能力を持つ", ex:["ファントム","ジン"],
   n:"【基準】通常EMFはゴーストの干渉があった場所でしか鳴らない。何の干渉もないのに足元でEMFが鳴ったらレイスのテレポート痕。類似能力のファントムはEMF2のみ、ジンはブレーカーの位置で鳴る点で区別できる。"},
  // ファントム
  {g:["ファントム"], cat:"能力", t:"ゴースト本体の写真を撮ると姿が消え、写真にノイズも本体も写らない",
   n:"【基準】通常はゴースト本体を撮影すると姿とノイズが写真に写る。ファントムだけは撮った瞬間に消え、写真に何も写らない。「星3のゴースト写真なのに空っぽ」なら確定級。"},
  {g:["ファントム"], cat:"能力", t:"姿を直視しているプレイヤーの正気度が急激に低下する",
   n:"【基準】どのゴーストも姿を見ると正気度は減るが、ファントムは減りが極端に速い。イベント後に見ていた人だけ正気度が激減していたら疑い。姿を見ないよう目を逸らすのが対策。"},
  {g:["ファントム"], cat:"ハント中", hunt:true, t:"ハント中の実体化時間が非常に短く、姿がほとんど見えない", ex:["鬼","化け狐"],
   n:"【基準】ハント中のゴーストは点滅しながら実体化して迫ってくる。ファントムは見えている時間が最も短く「足音はするのにほぼ見えない」。逆に最もよく見えるのが鬼。点滅の見え方はファントム/鬼/化け狐の判別に使える。"},
  {g:["ファントム"], cat:"能力", t:"ランダムなプレイヤーの近くへ移動し、移動完了地点にEMF2を残す能力を持つ", ex:["レイス"],
   n:"レイスのテレポート(EMF2または5)と似るが、ファントムはEMF2のみ。能力の使用中は他の行動を取れないため、この直後にハントは来ない。"},
  // ポルターガイスト
  {g:["ポルターガイスト"], cat:"能力", t:"複数の物を同時に投げ飛ばし、目撃の有無に関係なく近くのプレイヤーの正気度を「物の数×2%」下げる",
   n:"【基準】通常のゴーストは物を1個ずつしか投げない。複数の小物が一斉に吹き飛んだらほぼポルターガイスト。ゴーストルームに小物をまとめて置いておくと発動確認しやすい。"},
  {g:["ポルターガイスト"], cat:"ハント中", hunt:true, t:"ハント中、範囲内の物を0.5秒ごとに100%の確率で投げる(通常のゴーストは50%)",
   n:"【基準】ハント中はどのゴーストも0.5秒ごとに50%で物を投げるが、ポルターガイストは100%=通り道の物が必ず全部飛ぶ。他のゴーストが偶然50%を連続で引くこともあるので複数回確認を。"},
  {g:["ポルターガイスト"], cat:"行動", t:"投げられる物が周囲に無いと能力が発動できず、ほぼ無力化する",
   n:"投げ能力が本体なので、部屋の小物を全部外へ運び出すとほぼ何もできなくなる。対策で無力化が成立する唯一のゴースト。"},
  // バンシー
  {g:["バンシー"], cat:"行動", t:"ターゲットを1人に定め、そのプレイヤーの正気度だけを基準にハントを開始する",
   n:"【基準】通常のハントは「全員の平均正気度50%以下」で発生する。バンシーだけはターゲット1人の正気度しか見ない。チーム平均が高いのにハントが来たら、ターゲットだけ削れている可能性。誰が追われているか把握しておくこと。"},
  {g:["バンシー"], cat:"行動", t:"指向性マイクやサウンドレコーダーで、固有の金切り声(叫び声)を拾えることがある", ex:["マイリング","デオヘン","モーロイ"],
   n:"【基準】指向性マイクの怪奇音は通常ささやきやうめき声。バンシーは約33%で固有の金切り声を出し、聞けた時点で確定。ハントを起こさず特定できる安全な方法。"},
  {g:["バンシー"], cat:"ハント中", hunt:true, t:"ハント中はターゲットだけを追い、ターゲット以外はすれ違っても触れても死なない(ターゲットがエリア内にいる間)",
   n:"【基準】通常のゴーストはハント中、見つけた誰でも殺す。バンシーだけはターゲット以外を無視する。全員エリア内で、確実に視認されたのに見向きもされなければ確定。ただしターゲットがエリア外だと通常ハント化して誰でも死ぬ。"},
  {g:["バンシー"], cat:"行動", t:"女性としてのみ出現する(v0.15.1.0〜)", ex:["ダヤン"],
   n:"【基準】ゴーストの性別は通常50%ずつのランダム。バンシーとダヤンだけ女性固定なので、モデルか名前(ファーストネーム)が男性なら両者を除外できる。"},
  // ジン
  {g:["ジン"], cat:"移動速度", hunt:true, t:"ブレーカーがONの時、プレイヤーが近くにいない場合は2.5m/sで高速接近する(近づくと通常速度)", ex:["雷獣","ハントゥ","レヴナント","ディルデガスト"],
   n:"【基準】通常のハント速度は1.7m/s。ジンはブレーカーON+プレイヤーが遠い時だけ2.5m/sで詰めてきて、目の前では1.7m/sに戻る。ブレーカーを切れば高速移動も特殊能力も無効化できるのが最大の対策。"},
  {g:["ジン"], cat:"行動", t:"ブレーカーを直接OFFにすることが原則ない", ex:["ハントゥ"],
   n:"【基準】多くのゴーストはブレーカーを落とすことがある。ジンだけは原則落とさないので、落ちたらジンをほぼ除外できる(逆によく落ちるならハントゥ疑い)。部屋の照明を消すのは別物なので混同しないこと。"},
  {g:["ジン"], cat:"能力", t:"同室または3m以内のプレイヤーの正気度を25%減らし、ブレーカーにEMF2または5を残す能力を持つ(ブレーカーON時のみ)",
   n:"正気度25%の急減はジン・怨霊系イベントを除けば異常な量(通常のイベントは10%程度)。急減+誰もいないブレーカーでのEMF反応が揃ったらジン。ブレーカーにEMFリーダーを置いておくと検出できる。"},
  // メアー
  {g:["メアー"], cat:"ハント条件", hunt:true, t:"照明が消えた場所では正気度60%から、点いた場所では40%からハントを開始する",
   n:"【基準】通常のハント閾値は50%。メアーは暗所60%(早く来る)/明所40%(来にくい)。部屋の照明を点けておくだけで安全度が上がり、正気度40〜50%で照明ON中にハントが来たらメアー除外という判別もできる。"},
  {g:["メアー"], cat:"行動", t:"照明を自分から点けることがなく、超常現象での電球破壊率が他より高い",
   n:"【基準】他のゴーストは照明を点けることもある。メアーは絶対に点けないので、ゴーストが照明を点けた時点でメアー除外。電球がパンパン割れるならメアー疑い。"},
  {g:["メアー"], cat:"能力", t:"4m以内で照明をONにされた瞬間、低確率で即座にOFFにする能力を持つ",
   n:"スイッチを入れた瞬間に消し返してくるのはメアー固有の能力。スイッチごとに約10秒のクールタイムがあるので連打での強制発動はできない。テレビやPCの電源でも発動する。"},
  // レヴナント
  {g:["レヴナント"], cat:"移動速度", hunt:true, t:"ハント中、プレイヤーを発見すると3m/s(最速級)、見失うと1m/sまで低下する", ex:["デオヘン","ディルデガスト"],

// ===== ユーティリティ =====
const rand = n => Math.floor(Math.random()*n);
const pick = arr => arr[rand(arr.length)];
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// ミミックは何でも模倣するため、誤答選択肢から除外
function distractorPool(fact){
  const banned = new Set([...fact.g, ...(fact.ex||[]), "ミミック"]);
  return GHOSTS.filter(g => !banned.has(g));
}

// ===== 成績(通算 + 問題別) =====
const stats = {correct:0, total:0, streak:0, best:0};
let qstats = {}; // key -> [出題回数, 正解回数, 現在の連続正解]
try{
  const saved = JSON.parse(localStorage.getItem("phasmoQuizStats") || "null");
  if(saved && typeof saved.correct === "number"){
    Object.assign(stats, {correct:saved.correct||0, total:saved.total||0, best:saved.best||0});
  }
  const savedQ = JSON.parse(localStorage.getItem("phasmoQuizQ") || "null");
  if(savedQ && typeof savedQ === "object") qstats = savedQ;
}catch(e){}

function saveStats(){
  try{
    localStorage.setItem("phasmoQuizStats", JSON.stringify({correct:stats.correct, total:stats.total, best:stats.best}));
    localStorage.setItem("phasmoQuizQ", JSON.stringify(qstats));
  }catch(e){}
}

// 問題別成績: 「3回連続正解」で習得扱い(まぐれ当たり排除)
const MASTER_STREAK = 3;
function qstat(key){
  const s = qstats[key];
  return s ? [s[0]||0, s[1]||0, s[2]||0] : [0,0,0];
}
function isMastered(key){ return qstat(key)[2] >= MASTER_STREAK; }
function recordQ(key, ok){
  const s = qstat(key);
  s[0]++;
  if(ok){ s[1]++; s[2]++; } else { s[2] = 0; }
  qstats[key] = s;
}
function renderStats(){
  document.getElementById("stCorrect").textContent = stats.correct;
  document.getElementById("stTotal").textContent = stats.total;
  document.getElementById("stStreak").textContent = stats.streak;
  document.getElementById("stBest").textContent = stats.best;
  document.getElementById("stRate").textContent =
    stats.total ? Math.round(100*stats.correct/stats.total) + "%" : "-";
}

// ===== 問題生成 =====
const recent = [];
function remember(key){ recent.push(key); if(recent.length > 18) recent.shift(); }
function isRecent(key){ return recent.includes(key); }

// 未出題・未習得の問題を優先し、習得済みはたまに復習として出す
function pickWeighted(items){
  const weights = items.map(it=>{
    if(isRecent(it.key)) return 0.001;
    const [a,,st] = qstat(it.key);
    if(st >= MASTER_STREAK) return 0.15; // 習得済み: 低頻度の復習
    if(a === 0) return 1.4;              // 未出題: 優先
    return 1.0;                          // 挑戦中
  });
  let r = Math.random() * weights.reduce((x,y)=>x+y, 0);
  for(let i=0;i<items.length;i++){ r -= weights[i]; if(r <= 0) return items[i]; }
  return items[items.length-1];
}

function makeWhichQ(fact){
  remember(fact.key);
  const answer = pick(fact.g);
  const options = shuffle([answer, ...shuffle(distractorPool(fact)).slice(0,3)]);
  return {
    type:"どのゴースト?", cat:fact.cat, hunt:!!fact.hunt, key:fact.key,
    q:`次の特徴を持つゴーストは?\n「${fact.t}」`,
    options, answer,
    expl:`これは <b>${fact.g.join("・")}</b> の特徴。` + (fact.n ? `<br>${fact.n}` : "")
  };
}

function makeNumericQ(item){
  remember(item.key);
  return {
    type:"数値クイズ", cat:item.cat, hunt:!!item.hunt, key:item.key,
    q:item.q,
    options:item.opts.slice(),
    answer:item.opts[item.ans],
    expl:item.expl
  };
}

function nextQuestion(){
  const pool = [
    ...FACTS.map(f => ({kind:"fact", key:f.key, ref:f})),
    ...NUMERIC.map(n => ({kind:"num", key:n.key, ref:n})),
  ];
  const it = pickWeighted(pool);
  if(it.kind === "num") return makeNumericQ(it.ref);
  return makeWhichQ(it.ref);
}

let current = null;
let qCount = 0;

const elQ = document.getElementById("qtext");
const elAnswers = document.getElementById("answers");
const elFeedback = document.getElementById("feedback");
const elVerdict = document.getElementById("verdict");
const elExpl = document.getElementById("expl");
const elQRecord = document.getElementById("qrecord");

function showQuestion(){
  current = nextQuestion();
  qCount++;
  document.getElementById("qno").textContent = "Q" + qCount;
  document.getElementById("chipCat").textContent = current.cat;
  const chipType = document.getElementById("chipType");
  chipType.textContent = current.hunt ? "⚠ ハント関連 / " + current.type : current.type;
  chipType.className = current.hunt ? "chip hunt" : "chip";

  elQ.textContent = current.q;
  elFeedback.hidden = true;
  elAnswers.className = "answers";
  elAnswers.innerHTML = "";
  current.options.forEach(opt=>{
    const b = document.createElement("button");
    b.className = "ans";
    b.textContent = opt;
    b.addEventListener("click", ()=>answer(b, opt));
    elAnswers.appendChild(b);
  });
  const idk = document.createElement("button");
  idk.className = "ans idk";
  idk.textContent = "分からん…";
  idk.addEventListener("click", ()=>answer(idk, IDK));
  elAnswers.appendChild(idk);
  elAnswers.querySelector("button")?.focus({preventScroll:true});
}

const IDK = Symbol("idk");

function answer(btn, opt){
  const ok = opt === current.answer;
  const idk = opt === IDK;
  for(const b of elAnswers.querySelectorAll("button")){
    b.disabled = true;
    if(b.textContent === current.answer) b.classList.add("correct");
  }
  if(!ok && !idk) btn.classList.add("wrong");

  stats.total++;
  if(ok){ stats.correct++; stats.streak++; if(stats.streak > stats.best) stats.best = stats.streak; }
  else stats.streak = 0;
  recordQ(current.key, ok);
  saveStats();
  renderStats();

  elVerdict.textContent = ok ? "せいかい!"
    : idk ? "正解は「" + current.answer + "」── おぼえよう!"
    : "ざんねん… 正解は「" + current.answer + "」";
  elVerdict.className = "verdict " + (ok ? "ok" : "ng");
  elExpl.innerHTML = current.expl;
  const [a, c, st] = qstat(current.key);
  const mline = st >= MASTER_STREAK
    ? `<b>習得済み!</b>(${st}回連続正解中)`
    : `習得まで あと<b>${MASTER_STREAK - st}</b>回連続正解`;
  elQRecord.innerHTML =
    `この問題: 連続 <b>${Math.min(st, MASTER_STREAK)}</b>/${MASTER_STREAK} ・ 通算 ${c}/${a}回正解 ── ${mline}`;
  elFeedback.hidden = false;
  document.getElementById("nextBtn").focus({preventScroll:true});
}

// ===== 理解度画面 =====
// ゴースト -> 紐付く問題リスト(特徴 + 数値)
function questionsFor(name){
  const qs = [];
  for(const f of FACTS){
    if(f.g.includes(name)) qs.push({key:f.key, text:f.t, hunt:!!f.hunt});
  }
  for(const n of NUMERIC){
    if(n.g === name) qs.push({key:n.key, text:n.q, hunt:!!n.hunt});
  }
  return qs;
}
function commonQuestions(){
  return NUMERIC.filter(n => n.g === null).map(n => ({key:n.key, text:n.q, hunt:!!n.hunt}));
}

// 習得度 = 各問題の連続正解の進み(min(連続,3)/3)の平均。3回連続正解で習得=100%
function masteryOf(qs){
  let prog = 0, asked = 0, mastered = 0, a = 0, c = 0;
  for(const q of qs){
    const [qa, qc, st] = qstat(q.key);
    if(qa > 0){ asked++; a += qa; c += qc; }
    prog += Math.min(st, MASTER_STREAK) / MASTER_STREAK;
    if(st >= MASTER_STREAK) mastered++;
  }
  return {
    pct: qs.length ? Math.round(100 * prog / qs.length) : 0,
    asked, mastered, total: qs.length, a, c
  };
}

function markFor(qa, st){
  if(qa === 0) return ["-", "lv-none"];
  if(st >= MASTER_STREAK) return ["◎", "lv-hi"];
  if(st > 0) return ["○", "lv-mid"];
  return ["✕", "lv-lo"];
}
function lvClass(pct, asked){
  if(asked === 0) return "lv-none";
  if(pct >= 80) return "lv-hi";
  if(pct >= 50) return "lv-mid";
  return "lv-lo";
}

const openCards = new Set(); // 再描画しても展開状態を保つ

function renderGCard(name, qs){
  const m = masteryOf(qs);
  const d = document.createElement("details");
  d.className = "gcard";
  const rows = qs.map(q=>{
    const [qa, qc, st] = qstat(q.key);
    const [mark, cls] = markFor(qa, st);
    const cnt = qa === 0 ? "未出題"
      : st >= MASTER_STREAK ? `習得済み ・ 通算${qc}/${qa}回`
      : `連続${Math.min(st, MASTER_STREAK)}/${MASTER_STREAK} ・ 通算${qc}/${qa}回`;
    return `<div class="qrow${q.hunt ? " hunt" : ""}">
      <span class="mark ${cls}">${mark}</span>
      <span class="txt">${q.text}</span>
      <span class="cnt">${cnt}</span>
    </div>`;
  }).join("");
  const done = m.mastered === m.total && m.total > 0;
  d.innerHTML = `
    <summary>
      <span class="gname">${name}</span>
      <span class="gbarwrap">
        <span class="gbar"><i style="width:${m.pct}%"></i></span>
        <span class="gsub">習得 ${m.mastered}/${m.total}問 ・ 出題済み ${m.asked}/${m.total}問</span>
      </span>
      <span class="gpct ${lvClass(m.pct, m.asked)}">${m.asked === 0 ? "未" : done ? "完" : m.pct + "%"}</span>
    </summary>
    <div class="gdetail">${rows}</div>`;
  d.open = openCards.has(name);
  d.addEventListener("toggle", ()=>{
    if(d.open) openCards.add(name); else openCards.delete(name);
  });
  return d;
}

function renderMastery(){
  const glist = document.getElementById("glist");
  const glistCommon = document.getElementById("glistCommon");
  glist.innerHTML = "";
  glistCommon.innerHTML = "";

  let ghostsDone = 0;
  for(const name of GHOSTS){
    const qs = questionsFor(name);
    const m = masteryOf(qs);
    if(m.mastered === m.total && m.total > 0) ghostsDone++;
    glist.appendChild(renderGCard(name, qs));
  }
  glistCommon.appendChild(renderGCard(COMMON, commonQuestions()));

  // 総合習得度は全問題ベース
  const all = [...FACTS, ...NUMERIC].map(x => ({key:x.key}));
  const om = masteryOf(all);
  document.getElementById("ovPct").textContent =
    om.mastered === om.total ? "完全習得!" : om.pct + "%";
  document.getElementById("ovBar").style.width = om.pct + "%";
  document.getElementById("ovSub").textContent =
    `習得 ${om.mastered}/${om.total}問 ・ 出題済み ${om.asked}/${om.total}問 ・ 完全習得ゴースト ${ghostsDone}/${GHOSTS.length}体`;
}

// すべて展開 / 閉じる
document.getElementById("expandAllBtn").addEventListener("click", ()=>{
  const cards = document.querySelectorAll("details.gcard");
  const anyClosed = [...cards].some(d => !d.open);
  cards.forEach(d => d.open = anyClosed);
  document.getElementById("expandAllBtn").textContent = anyClosed ? "すべて閉じる" : "すべて展開";
});

// ===== タブ切り替え =====
const tabQuiz = document.getElementById("tabQuiz");
const tabMastery = document.getElementById("tabMastery");
const viewQuiz = document.getElementById("viewQuiz");
const viewMastery = document.getElementById("viewMastery");
let view = "quiz";

function switchView(v){
  view = v;
  const quiz = v === "quiz";
  tabQuiz.classList.toggle("active", quiz);
  tabMastery.classList.toggle("active", !quiz);
  viewQuiz.style.display = quiz ? "flex" : "none";
  viewMastery.style.display = quiz ? "none" : "flex";
  if(!quiz) renderMastery();
}
tabQuiz.addEventListener("click", ()=>switchView("quiz"));
tabMastery.addEventListener("click", ()=>switchView("mastery"));

// ===== その他操作 =====
document.getElementById("nextBtn").addEventListener("click", showQuestion);
document.getElementById("resetBtn").addEventListener("click", ()=>{
  stats.correct = 0; stats.total = 0; stats.streak = 0; stats.best = 0;
  qstats = {};
  saveStats(); renderStats();
  if(view === "mastery") renderMastery();
});

// キーボード: 1-4で回答、0/5で「分からん」、Enterで次へ
document.addEventListener("keydown", e=>{
  if(view !== "quiz") return;
  if(!elFeedback.hidden && e.key === "Enter"){ showQuestion(); return; }
  if(elFeedback.hidden && (e.key === "0" || e.key === "5")){
    elAnswers.querySelector(".idk:not(:disabled)")?.click();
    return;
  }
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 4 && elFeedback.hidden){
    const btns = elAnswers.querySelectorAll("button:not(.idk):not(:disabled)");
    if(btns[n-1]) btns[n-1].click();
  }
});

renderStats();
showQuestion();
</script>
